<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020" role="img" aria-labelledby="title desc">
  <title id="title">APB FIFO UART UVM Verification Architecture</title>
  <desc id="desc">Architecture of the UVM testbench, APB interface, configurable FIFO, UART transmitter, monitors, scoreboard, and coverage.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#f5f7fb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#172554" flood-opacity=".10"/></filter>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#059669"/></marker>
    <marker id="orangeArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ea580c"/></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.title{font-size:32px;font-weight:750}.subtitle{font-size:15px;fill:#64748b}.group-title{font-size:18px;font-weight:700;letter-spacing:.4px}.box-title{font-size:17px;font-weight:700}.body{font-size:13px;fill:#475569}.small{font-size:12px;fill:#64748b}.edge{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:2.4}.blue{stroke:#2563eb;marker-end:url(#blueArrow)}.green{stroke:#059669;marker-end:url(#greenArrow)}.orange{stroke:#ea580c;marker-end:url(#orangeArrow)}.dash{stroke-dasharray:7 7}.uvm-box{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.dut-box{fill:#ecfdf5;stroke:#34d399;stroke-width:2}.check-box{fill:#fff7ed;stroke:#fb923c;stroke-width:2}.if-box{fill:#f5f3ff;stroke:#8b5cf6;stroke-width:2}.pill{fill:#fff;stroke:#cbd5e1}.label{font-size:12px;font-weight:650;fill:#334155}.num{font-size:12px;font-weight:800;fill:#fff}
    </style>
  </defs>
  <rect width="1600" height="1020" fill="url(#bg)"/>
  <text x="70" y="58" class="title">APB FIFO UART · UVM Verification Architecture</text>
  <text x="70" y="85" class="subtitle">APB4 control path, configurable synchronous FIFO, automatic UART transmission, and end-to-end checking</text>

  <!-- UVM group -->
  <rect x="55" y="120" width="1490" height="300" rx="24" fill="#fff" stroke="#bfdbfe" stroke-width="2" filter="url(#shadow)"/>
  <rect x="55" y="120" width="1490" height="48" rx="24" fill="#dbeafe"/><path d="M55 145h1490v23H55z" fill="#dbeafe"/>
  <text x="82" y="151" class="group-title" fill="#1d4ed8">UVM VERIFICATION ENVIRONMENT</text>

  <g filter="url(#shadow)"><rect x="90" y="210" width="185" height="100" rx="15" class="uvm-box"/><rect x="320" y="210" width="175" height="100" rx="15" class="uvm-box"/><rect x="540" y="210" width="175" height="100" rx="15" class="uvm-box"/><rect x="760" y="210" width="175" height="100" rx="15" class="uvm-box"/>
    <rect x="1010" y="190" width="210" height="100" rx="15" class="uvm-box"/><rect x="1010" y="310" width="210" height="80" rx="15" class="uvm-box"/>
    <rect x="1280" y="190" width="220" height="100" rx="15" class="check-box"/><rect x="1280" y="310" width="220" height="80" rx="15" class="check-box"/></g>
  <text x="182" y="242" text-anchor="middle" class="box-title">Directed Tests</text><text x="182" y="269" text-anchor="middle" class="body">TC01 – TC11</text><text x="182" y="290" text-anchor="middle" class="small">data · status · reset · corners</text>
  <text x="407" y="252" text-anchor="middle" class="box-title">APB Sequences</text><text x="407" y="279" text-anchor="middle" class="body">read / write items</text>
  <text x="627" y="252" text-anchor="middle" class="box-title">APB Sequencer</text><text x="627" y="279" text-anchor="middle" class="body">transaction ordering</text>
  <text x="847" y="252" text-anchor="middle" class="box-title">APB Driver</text><text x="847" y="279" text-anchor="middle" class="body">protocol pin driving</text>
  <text x="1115" y="228" text-anchor="middle" class="box-title">APB Monitor</text><text x="1115" y="253" text-anchor="middle" class="body">observed requests + responses</text><text x="1115" y="273" text-anchor="middle" class="small">inside active APB agent</text>
  <text x="1115" y="342" text-anchor="middle" class="box-title">UART Monitor</text><text x="1115" y="367" text-anchor="middle" class="body">reset-aware frame decoder</text>
  <text x="1390" y="226" text-anchor="middle" class="box-title">Scoreboard</text><text x="1390" y="251" text-anchor="middle" class="body">expected byte queue</text><text x="1390" y="271" text-anchor="middle" class="small">APB status / error checks</text>
  <text x="1390" y="342" text-anchor="middle" class="box-title">Functional Coverage</text><text x="1390" y="367" text-anchor="middle" class="body">R/W · addr · PSLVERR · depth</text>
  <path d="M275 260H320" class="edge blue"/><path d="M495 260H540" class="edge blue"/><path d="M715 260H760" class="edge blue"/>
  <path d="M1220 230H1280" class="edge orange"/><path d="M1220 350H1250V270H1280" class="edge orange"/><path d="M1220 250H1250V350H1280" class="edge orange"/>
  <text x="1248" y="218" class="label">APB txn</text><text x="1232" y="378" class="label">UART byte</text>

  <!-- Interface -->
  <g filter="url(#shadow)"><rect x="490" y="455" width="620" height="105" rx="20" class="if-box"/></g>
  <text x="800" y="491" text-anchor="middle" class="box-title">tb_top + apb_uart_if</text>
  <text x="800" y="518" text-anchor="middle" class="body">PCLK · PRESETn · APB4 bus · uart_baud_div · uart_tx_o / busy / done</text>
  <text x="800" y="542" text-anchor="middle" class="small">virtual interface shared through uvm_config_db</text>
  <path d="M847 310V455" class="edge blue"/><text x="860" y="390" class="label">drive APB4</text>
  <path d="M1010 240H970V440H1035V455" class="edge blue dash"/><text x="977" y="429" class="label">sample</text>
  <path d="M1115 310V285H1160V440H1070V455" class="edge blue dash"/>

  <!-- DUT group -->
  <rect x="55" y="600" width="1490" height="360" rx="24" fill="#fff" stroke="#a7f3d0" stroke-width="2" filter="url(#shadow)"/>
  <rect x="55" y="600" width="1490" height="48" rx="24" fill="#d1fae5"/><path d="M55 625h1490v23H55z" fill="#d1fae5"/>
  <text x="82" y="631" class="group-title" fill="#047857">DUT · Sync_FIFO</text>
  <g filter="url(#shadow)"><rect x="95" y="705" width="245" height="135" rx="16" class="dut-box"/><rect x="395" y="680" width="245" height="115" rx="16" class="dut-box"/><rect x="395" y="820" width="245" height="90" rx="16" class="dut-box"/><rect x="700" y="705" width="290" height="135" rx="16" class="dut-box"/><rect x="1050" y="720" width="215" height="105" rx="16" class="dut-box"/><rect x="1325" y="690" width="175" height="165" rx="16" class="dut-box"/></g>
  <text x="217" y="742" text-anchor="middle" class="box-title">APB4 Slave</text><text x="217" y="768" text-anchor="middle" class="body">address decode + access control</text><text x="217" y="791" text-anchor="middle" class="small">PREADY · PRDATA · PSLVERR</text><text x="217" y="814" text-anchor="middle" class="small">register / FIFO address regions</text>
  <text x="517" y="715" text-anchor="middle" class="box-title">Register Block</text><text x="517" y="742" text-anchor="middle" class="body">depth config @ 0x0000_0000</text><text x="517" y="765" text-anchor="middle" class="body">8 × 32-bit registers</text>
  <text x="517" y="851" text-anchor="middle" class="box-title">Status Register</text><text x="517" y="878" text-anchor="middle" class="body">count · full · empty @ 0x20</text>
  <text x="845" y="739" text-anchor="middle" class="box-title">Configurable Sync FIFO</text><text x="845" y="768" text-anchor="middle" class="body">8-bit × 8 / 16 / 32 / 64 / 128 / 256</text><text x="845" y="792" text-anchor="middle" class="small">mem · w_ptr · r_ptr · count</text><text x="845" y="816" text-anchor="middle" class="small">wrap-around + simultaneous push/pop</text>
  <text x="1157" y="753" text-anchor="middle" class="box-title">FIFO → UART Bridge</text><text x="1157" y="780" text-anchor="middle" class="body">r_ready / r_valid</text><text x="1157" y="803" text-anchor="middle" class="small">latch byte + pulse tx_start</text>
  <text x="1412" y="724" text-anchor="middle" class="box-title">UART TX FSM</text><text x="1412" y="752" text-anchor="middle" class="body">IDLE → START</text><text x="1412" y="775" text-anchor="middle" class="body">→ DATA → STOP</text><text x="1412" y="803" text-anchor="middle" class="small">baud divider</text><text x="1412" y="825" text-anchor="middle" class="small">0 safely becomes 1</text>
  <path d="M340 740H395" class="edge green"/><text x="351" y="728" class="label">config</text><path d="M340 795H675V772H700" class="edge green"/><text x="480" y="786" class="label">FIFO write byte</text>
  <path d="M640 738H680V735H700" class="edge green"/><text x="648" y="721" class="label">fifo_depth</text><path d="M700 825H660V865H640" class="edge green"/><text x="664" y="885" class="label">count / flags</text>
  <path d="M990 772H1050" class="edge green"/><text x="997" y="758" class="label">head byte</text><path d="M1265 772H1325" class="edge green"/><text x="1273" y="758" class="label">tx_start</text>
  <path d="M490 507H217V705" class="edge green"/><text x="250" y="590" class="label">APB4 + reset + baud_div</text>
  <path d="M1412 690V585H1050V560" class="edge green"/><text x="1194" y="578" class="label">uart_tx_o · busy · done</text>
  <rect x="95" y="872" width="245" height="42" rx="21" class="pill"/><text x="217" y="898" text-anchor="middle" class="small">SVA: full / empty protection</text>
  <text x="800" y="988" text-anchor="middle" class="subtitle">End-to-end path: APB4 write → FIFO enqueue → ready/valid transfer → UART frame → monitor decode → scoreboard compare</text>
</svg>
